<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور - سابق كال | Forgot Password - Saabq Cal</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:['selector','[data-theme="dark"]'],theme:{extend:{colors:{brand:{50:'#e6f7f8',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0a9099',700:'#11646a',800:'#0e4c6b',900:'#062837'},primary:{DEFAULT:'#0a9099',hover:'#11646a',light:'#169393',subtle:'#e6f7f8'},secondary:{DEFAULT:'#166992',hover:'#0e4c6b'},amber:{400:'#FCD34D',500:'#F59E0B',600:'#D97706'}},fontFamily:{sans:['Inter','IBM Plex Sans Arabic','sans-serif']}}}}</script>
  <script src="../assets/js/theme.js"></script><script src="../assets/js/lang.js"></script>
</head>
<body class="bg-[var(--bg-primary)] text-[var(--text-primary)] min-h-screen flex items-center justify-center p-6">
  <div class="absolute top-4 left-4 right-4 flex items-center justify-between"><a href="../public/index.html" class="flex items-center gap-2"><img src="../assets/images/logo.png" alt="Saabq Cal" class="h-8 w-auto object-contain">
        <span class="font-black text-lg gradient-text" data-ar="سابق كال" data-en="Saabq Cal">سابق كال</span></a><div class="flex items-center gap-2"><button data-lang-toggle class="btn-ghost text-xs font-semibold px-2.5 py-1 rounded-lg border" style="border-color:var(--border-color);color:var(--text-secondary)"><span class="lang-label">EN</span></button><button data-theme-toggle class="btn-ghost p-1.5 rounded-lg border" style="border-color:var(--border-color);color:var(--text-secondary)"><svg class="icon-sun w-4 h-4" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg><svg class="icon-moon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button></div></div>

  <div class="w-full max-w-md animate-fade-in-up">
    <div class="card-static p-8 lg:p-10">
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 012 2m4 0a6 6 01-7.743 5.743L11 17H9v2H7v2H4a1 1 01-1-1v-2.586a1 1 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="text-2xl font-extrabold mb-2" style="color:var(--text-primary)" data-ar="نسيت الباسورد؟" data-en="Forgot Your Password?">نسيت الباسورد؟</h1>
        <p class="text-sm" style="color:var(--text-secondary)" data-ar="أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين الباسورد" data-en="Enter your email and we'll send you a password reset link">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور</p>
      </div>

      <form class="space-y-4">
        <div>
          <label class="input-label" data-ar="الإيميل" data-en="Email">الإيميل</label>
          <input type="email" class="input-field" data-ar-placeholder="أدخل بريدك الإلكتروني" data-en-placeholder="Enter your email" placeholder="أدخل بريدك الإلكتروني">
        </div>
        <button type="submit" class="btn-primary w-full !py-3 !rounded-xl"><span data-ar="ابعتلي لينك الباسورد الجديد ✉️" data-en="Send Reset Link">ابعتلي لينك الباسورد الجديد ✉️</span></button>
      </form>

      <!-- Success State (hidden by default) -->
      <div class="hidden text-center mt-6" id="successState">
        <div class="w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center mx-auto mb-4"><svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19v-8.93a2 2 01.89-1.664l7-4.666a2 2 012.22 0l7 4.666A2 2 0121 10.07V19M3 19a2 2 002 2h14a2 2 002-2M3 19l6.75-4.5M21 19l-6.75-4.5M3 10l6.75 4.5M21 10l-6.75 4.5m0 0l-1.14.76a2 2 01-2.22 0l-1.14-.76"/></svg></div>
        <h3 class="text-lg font-bold mb-2" style="color:var(--text-primary)" data-ar="تم الإرسال!" data-en="Email Sent!">تم الإرسال!</h3>
        <p class="text-sm" style="color:var(--text-secondary)" data-ar="تحقق من بريدك الإلكتروني واتبع التعليمات لإعادة تعيين الباسورد" data-en="Check your email and follow the instructions to reset your password">تحقق من بريدك الإلكتروني واتبع التعليمات لإعادة تعيين كلمة المرور</p>
      </div>

      <div class="text-center mt-6">
        <a href="login.html" class="text-sm font-medium text-brand-600 hover:text-brand-700 inline-flex items-center gap-2">
          <svg class="w-4 h-4 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7h18"/></svg>
          <span data-ar="العودة لسجل دخولك" data-en="Back to Sign In">العودة لتسجيل الدخول</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
